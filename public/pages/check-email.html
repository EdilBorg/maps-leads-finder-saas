<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme o seu email — Maps Leads Finder</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">Maps Leads Finder</div>
      <div class="auth-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="#e4f222" stroke-width="1.5"/>
          <path d="M3 7l9 6 9-6" stroke="#e4f222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Confirme o seu endereço de email</h1>
      <p class="sub" id="lead">
        Enviámos uma mensagem de confirmação para o seu endereço de email.
        Confirme-o para activar o acesso à sua conta.
      </p>
      <p class="masked-email" id="masked" hidden></p>
      <p class="hint">Verifique a caixa de entrada e a pasta de spam ou lixo electrónico.</p>
      <div class="error-box" id="err" role="alert"></div>
      <div class="success-box" id="ok" role="status"></div>
      <button type="button" class="btn btn-primary btn-block" id="resend">Reenviar email de confirmação</button>
      <div class="links">
        <a href="/pages/login.html">Voltar ao login</a>
      </div>
    </div>
  </div>
  <script>
  function maskEmail(email) {
    const s = String(email || '').trim();
    const at = s.indexOf('@');
    if (at < 1) return '';
    const local = s.slice(0, at);
    const domain = s.slice(at + 1);
    const maskPart = (part) => {
      if (part.length <= 2) return part[0] + '*';
      return part[0] + '*'.repeat(Math.min(part.length - 2, 7)) + part[part.length - 1];
    };
    const domainParts = domain.split('.');
    const domainMasked = domainParts
      .map((p, i) => (i === domainParts.length - 1 ? p : maskPart(p)))
      .join('.');
    return maskPart(local) + '@' + domainMasked;
  }

  async function getCsrf() {
    const res = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
    const data = await res.json();
    return data.csrfToken;
  }

  async function postJson(url, body) {
    const csrfToken = await getCsrf();
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': csrfToken,
      },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }

  const params = new URLSearchParams(location.search);
  let email = params.get('email') || sessionStorage.getItem('mlf_pending_email') || '';
  if (email) {
    sessionStorage.setItem('mlf_pending_email', email);
    const masked = maskEmail(email);
    const el = document.getElementById('masked');
    if (masked) {
      el.textContent = masked;
      el.hidden = false;
    }
  }

  document.getElementById('resend').addEventListener('click', async () => {
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    const btn = document.getElementById('resend');
    err.classList.remove('visible');
    ok.classList.remove('visible');
    if (!email) {
      err.textContent = 'Indique o email na página de login para solicitar um novo envio.';
      err.classList.add('visible');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'A enviar…';
    try {
      const { res, data } = await postJson('/api/auth/resend-verification', { email });
      if (!res.ok) {
        err.textContent = data.error || 'Não foi possível reenviar o email.';
        err.classList.add('visible');
      } else {
        ok.textContent = data.message || 'Se a conta existir, enviámos um novo email de confirmação.';
        ok.classList.add('visible');
      }
    } catch (e) {
      err.textContent = 'Erro de rede. Tente novamente.';
      err.classList.add('visible');
    }
    btn.disabled = false;
    btn.textContent = 'Reenviar email de confirmação';
  });
  </script>
</body>
</html>
