<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Maps Leads Finder</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">Maps Leads Finder</div>
      <h1>Iniciar sessão</h1>
      <p class="sub">Aceda à sua conta</p>
      <div class="error-box" id="err" role="alert"></div>
      <div class="success-box" id="ok" role="status"></div>
      <div class="pending-box" id="pending" hidden>
        <p class="pending-title">Este endereço de email ainda não foi confirmado.</p>
        <p class="pending-text">Confirme o seu endereço de email para aceder à sua conta. Se não recebeu a mensagem, pode solicitar um novo envio.</p>
        <button type="button" class="btn btn-secondary btn-block" id="resend">Reenviar email de confirmação</button>
      </div>
      <form id="form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Palavra-passe</label>
          <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn">Entrar</button>
      </form>
      <div class="links">
        <a href="/pages/forgot-password.html">Esqueceu a palavra-passe?</a><br>
        <a href="/pages/register.html">Criar conta</a>
      </div>
    </div>
  </div>
  <script>
  async function getCsrf() {
    const res = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
    const data = await res.json();
    return data.csrfToken;
  }
  async function postJson(url, body) {
    const csrfToken = await getCsrf();
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': csrfToken,
      },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }

  const pending = document.getElementById('pending');
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('visible');
    ok.classList.remove('visible');
    pending.hidden = true;
    const btn = document.getElementById('btn');
    btn.disabled = true;
    const email = document.getElementById('email').value.trim();
    const { res, data } = await postJson('/api/auth/login', {
      email,
      password: document.getElementById('password').value,
    });
    btn.disabled = false;
    if (!res.ok) {
      if (data.code === 'EMAIL_NOT_VERIFIED') {
        try { sessionStorage.setItem('mlf_pending_email', email); } catch (_) {}
        pending.hidden = false;
        return;
      }
      err.textContent = data.error || 'Falha no login.';
      err.classList.add('visible');
      return;
    }
    window.location.href = '/';
  });

  document.getElementById('resend').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    err.classList.remove('visible');
    ok.classList.remove('visible');
    const btn = document.getElementById('resend');
    btn.disabled = true;
    btn.textContent = 'A enviar…';
    try {
      const { res, data } = await postJson('/api/auth/resend-verification', { email });
      if (!res.ok) {
        err.textContent = data.error || 'Não foi possível reenviar o email.';
        err.classList.add('visible');
      } else {
        ok.textContent = data.message || 'Se a conta existir, enviámos um novo email de confirmação.';
        ok.classList.add('visible');
      }
    } catch (e) {
      err.textContent = 'Erro de rede. Tente novamente.';
      err.classList.add('visible');
    }
    btn.disabled = false;
    btn.textContent = 'Reenviar email de confirmação';
  });
  </script>
</body>
</html>
