<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registo — Maps Leads Finder</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">Maps Leads Finder</div>
      <h1>Criar conta</h1>
      <p class="sub">Registo gratuito · verificação de email obrigatória</p>
      <div class="error-box" id="err" role="alert"></div>
      <form id="form">
        <div class="form-group">
          <label class="form-label" for="name">Nome</label>
          <input class="input" type="text" id="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input" type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Palavra-passe</label>
          <input class="input" type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="passwordConfirm">Confirmar palavra-passe</label>
          <input class="input" type="password" id="passwordConfirm" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn">Registar</button>
      </form>
      <div class="links">
        <a href="/pages/login.html">Já tem conta? Entrar</a>
      </div>
    </div>
  </div>
  <script>
  (async function redirectIfAuthed() {
    try {
      const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        if (data && data.user) {
          window.location.replace('/');
        }
      }
    } catch (_) {}
  })();
  async function getCsrf() {
    const res = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
    const data = await res.json();
    return data.csrfToken;
  }
  async function postJson(url, body) {
    const csrfToken = await getCsrf();
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': csrfToken,
      },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.classList.remove('visible');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    const email = document.getElementById('email').value.trim();
    const { res, data } = await postJson('/api/auth/register', {
      name: document.getElementById('name').value,
      email,
      password: document.getElementById('password').value,
      passwordConfirm: document.getElementById('passwordConfirm').value,
    });
    btn.disabled = false;
    if (!res.ok) {
      err.textContent = data.error || (data.errors && data.errors[0]) || 'Falha no registo.';
      err.classList.add('visible');
      return;
    }
    try {
      sessionStorage.setItem('mlf_pending_email', email);
    } catch (_) {}
    const q = encodeURIComponent(email);
    window.location.href = '/pages/check-email.html?email=' + q;
  });
  </script>
</body>
</html>
