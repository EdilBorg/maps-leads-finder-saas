<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registo — Maps Leads Finder</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">Maps Leads Finder</div>
      <h1>Criar conta</h1>
      <p class="sub">Registo gratuito · verificação de email obrigatória</p>
      <div class="error-box" id="err"></div>
      <div class="success-box" id="ok"></div>
      <form id="form">
        <div class="form-group">
          <label class="form-label" for="name">Nome</label>
          <input class="input" type="text" id="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input" type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Palavra-passe</label>
          <input class="input" type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="passwordConfirm">Confirmar palavra-passe</label>
          <input class="input" type="password" id="passwordConfirm" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn">Registar</button>
      </form>
      <div class="links">
        <a href="/pages/login.html">Já tem conta? Entrar</a> · <a href="/">Voltar</a>
      </div>
    </div>
  </div>
  <script>
  async function postJson(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    err.classList.remove('visible');
    ok.classList.remove('visible');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    const { res, data } = await postJson('/api/auth/register', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      passwordConfirm: document.getElementById('passwordConfirm').value,
    });
    btn.disabled = false;
    if (!res.ok) {
      err.textContent = data.error || (data.errors && data.errors[0]) || 'Falha no registo.';
      err.classList.add('visible');
      return;
    }
    ok.textContent = data.message || 'Conta criada. Verifique o seu email.';
    ok.classList.add('visible');
    document.getElementById('form').reset();
  });
  </script>
</body>
</html>
