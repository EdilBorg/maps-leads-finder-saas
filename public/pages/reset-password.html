<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova palavra-passe — Maps Leads Finder</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">Maps Leads Finder</div>
      <h1>Nova palavra-passe</h1>
      <p class="sub">Defina uma nova palavra-passe</p>
      <div class="error-box" id="err"></div>
      <div class="success-box" id="ok"></div>
      <form id="form">
        <div class="form-group">
          <label class="form-label" for="password">Nova palavra-passe</label>
          <input class="input" type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="passwordConfirm">Confirmar</label>
          <input class="input" type="password" id="passwordConfirm" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn">Guardar</button>
      </form>
      <div class="links"><a href="/pages/login.html">Login</a></div>
    </div>
  </div>
  <script>
  async function getCsrf() {
    const res = await fetch('/api/auth/csrf', { credentials: 'same-origin' });
    if (!res.ok) {
      throw new Error('Não foi possível obter o token de segurança (CSRF).');
    }
    const data = await res.json().catch(() => ({}));
    if (!data.csrfToken) {
      throw new Error('Token de segurança inválido.');
    }
    return data.csrfToken;
  }
  async function postJson(url, body) {
    const csrfToken = await getCsrf();
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': csrfToken,
      },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    err.classList.remove('visible');
    ok.classList.remove('visible');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    try {
      const { res, data } = await postJson('/api/auth/reset-password', {
        token,
        password: document.getElementById('password').value,
        passwordConfirm: document.getElementById('passwordConfirm').value,
      });
      btn.disabled = false;
      if (!res.ok) {
        err.textContent = data.error || 'Falha ao redefinir.';
        err.classList.add('visible');
        return;
      }
      ok.textContent = data.message || 'Palavra-passe atualizada.';
      ok.classList.add('visible');
    } catch (ex) {
      btn.disabled = false;
      err.textContent = ex.message || 'Erro de rede ou de segurança.';
      err.classList.add('visible');
    }
  });
  </script>
</body>
</html>
